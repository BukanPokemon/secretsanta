<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags. This is the fallback template — every route
         also sets its own tags via useDocumentMeta once JS runs, and
         prerendering bakes the per-route versions into static HTML. What's
         here is what non-JS crawlers (link-preview bots checking a shared
         /pairing link, for instance) see, so it stays generic and never
         participant-specific. -->
    <title>Tukar Kado Online | Acak Nama Gratis, Tanpa Daftar</title>
    <meta name="title" content="Tukar Kado Online | Acak Nama Gratis, Tanpa Daftar" />
    <meta name="description" content="Acak nama tukar kado rahasia untuk kantor, keluarga, atau teman. Tinggal masukkan nama, bagikan linknya. Gratis, tanpa daftar akun, dan datanya tidak diupload ke server." />

    <!-- Open Graph / Facebook. URLs below must match src/config/site.ts's
         SITE_URL — plain HTML can't import it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bukanpawkemon.github.io/tukar-kado/" />
    <meta property="og:title" content="Tukar Kado Online | Acak Nama Gratis, Tanpa Daftar" />
    <meta property="og:description" content="Acak nama tukar kado rahasia untuk kantor, keluarga, atau teman. Tinggal masukkan nama, bagikan linknya. Gratis, tanpa daftar akun, dan datanya tidak diupload ke server." />
    <meta property="og:image" content="https://bukanpawkemon.github.io/tukar-kado/og/id.png" />

    <!-- Favicon -->
    <link rel="icon" href="./static/mistletoe.png" />

    <!-- Fork attribution, kept per the MIT license on the upstream
         project this was forked from (see README). -->
    <link rel="me" href="https://github.com/BukanPawkemon" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#DC2626" />
  </head>
  <body>
    <div id="root" class="text-xs sm:text-sm font-cherry-swash"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
